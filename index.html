<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Genera etiquetas QR para el inventario de muebles." />
  <title>QR de Muebles</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div>
        <h1>Inventario de oficina</h1>
      </div>
      <span class="header-status">Guardado en este equipo</span>
    </header>

    <section id="public-record" class="public-record" hidden aria-live="polite"></section>

    <section id="admin-app" class="workspace">
      <section class="panel form-panel" aria-labelledby="form-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Nuevo registro</p>
            <h2 id="form-title">Datos del mueble</h2>
          </div>
          <span id="asset-code" class="asset-code"></span>
        </div>

        <form id="furniture-form">
          <div class="form-grid">
            <label>
              Tipo
              <select id="type" name="type" required>
                <option value="">Selecciona uno</option>
                <option>Escritorio</option>
                <option>Silla</option>
                <option>Archivador</option>
                <option>Mesa</option>
                <option>Estante</option>
                <option>Otro</option>
              </select>
            </label>
            <label>
              Oficina
              <input id="location" name="location" type="text" placeholder="Ej. Oficina 2, piso 1" required maxlength="70" />
            </label>
            <label>
              Estado
              <select id="status" name="status" required>
                <option>Disponible</option>
                <option>En uso</option>
                <option>En mantenimiento</option>
                <option>Para baja</option>
              </select>
            </label>
          </div>
          <label>
            Observaciones
            <textarea id="notes" name="notes" placeholder="Garantia, medidas o indicaciones utiles. No incluyas datos privados." maxlength="180"></textarea>
          </label>
          <label>
            Foto del mueble
            <input id="photo" name="photo" type="file" accept="image/*" />
          </label>
          <div id="photo-preview" class="photo-preview" hidden>
            <img id="photo-preview-image" alt="Vista previa de la foto" />
          </div>
          <p id="form-message" class="form-message" role="status"></p>
          <div class="form-actions">
            <button type="submit">Crear QR</button>
            <button id="clear-form-btn" class="button-secondary" type="button">Limpiar</button>
          </div>
        </form>
      </section>

      <aside class="side-column">
        <section class="panel qr-panel" aria-labelledby="qr-title">
          <div class="section-heading compact">
            <div>
              <p class="eyebrow">Etiqueta</p>
              <h2 id="qr-title">Codigo QR</h2>
            </div>
          </div>
          <div id="qr-placeholder" class="qr-placeholder">Completa la ficha para generar su etiqueta.</div>
          <div id="qrcode" class="qr-code" hidden aria-label="Codigo QR generado"></div>
          <p id="qr-label" class="qr-label" hidden></p>
          <button id="download-qr-btn" class="button-secondary download-button" type="button" disabled>Descargar PNG</button>
        </section>
      </aside>
    </section>

    <section id="saved-records-section" class="saved-records" aria-labelledby="saved-title">
      <div class="saved-heading">
        <div>
          <h2 id="saved-title">Muebles registrados</h2>
        </div>
        <span id="record-count" class="record-count">0 muebles</span>
      </div>
      <div id="saved-records" class="records-list"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
